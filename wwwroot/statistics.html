<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Statistik</title>

    <link rel="stylesheet" href="statistics.css">
</head>

<body>

    <main class="statistics-page">

        <h1>Statistik</h1>

        <p class="subtitle">
            Översikt över dina todos
        </p>

        <section class="statistics-container">

            <!-- Skapade -->
            <div class="stat-card">
                <div class="stat-number" id="created-count">
                    0
                </div>

                <div class="stat-label">
                    Skapade
                </div>
            </div>


            <!-- Klara -->
            <div class="stat-card">
                <div class="stat-number" id="completed-count">
                    0
                </div>

                <div class="stat-label">
                    Klara
                </div>
            </div>


            <!-- Borttagna -->
            <div class="stat-card">
                <div class="stat-number" id="deleted-count">
                    0
                </div>

                <div class="stat-label">
                    Borttagna
                </div>
            </div>

        </section>

    </main>


    <script src="statistics.js"></script>

</body>

</html>
